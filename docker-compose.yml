services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: api-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-app
    environment:
      ConnectionStrings__DefaultConnection: "Server=${APP_DB_SERVER};Database=${APP_DB_NAME};User Id=${APP_DB_USER};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5000:5296"
    depends_on:
      sql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql_data: